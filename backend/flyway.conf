# Flyway configuration for BCPS Redistricting database

# JDBC URL - Will be overridden by environment variable FLYWAY_URL or docker-compose
flyway.url=jdbc:postgresql://localhost:5432/bcps_redistricting

# Database credentials - Will be overridden by environment variables
flyway.user=bcps_user
flyway.password=bcps_password

# Location of SQL migration files
flyway.locations=filesystem:./migrations

# Schema to manage
flyway.schemas=public

# Encoding of SQL migration files
flyway.encoding=UTF-8

# Validate migrations on migrate
flyway.validateOnMigrate=true

# Create schema if it doesn't exist
flyway.createSchemas=true

# Baseline version
flyway.baselineVersion=0

# Baseline description
flyway.baselineDescription=Initial baseline
