name: Deploy Full Stack to Azure

on:
  push:
    branches:
      - develop    # Auto-deploy dev environment
      - staging    # Auto-deploy staging environment
    paths:
      - 'src/**'
      - 'backend/**'
      - 'package*.json'
      - '.github/workflows/deploy-fullstack.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (dev, staging, prod)'
        required: false
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_backend:
        description: 'Skip backend deployment'
        required: false
        default: 'false'
      skip_frontend:
        description: 'Skip frontend deployment'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: bcpsredistricting-${{ github.event.inputs.environment || (github.ref == 'refs/heads/develop' && 'dev') || (github.ref == 'refs/heads/staging' && 'staging') || 'prod' }}-acr
  ENVIRONMENT: bcpsredistricting-${{ github.event.inputs.environment || (github.ref == 'refs/heads/develop' && 'dev') || (github.ref == 'refs/heads/staging' && 'staging') || 'prod' }}-env
  RESOURCE_GROUP: bcps-redistricting-${{ github.event.inputs.environment || (github.ref == 'refs/heads/develop' && 'dev') || (github.ref == 'refs/heads/staging' && 'staging') || 'prod' }}-rg
  CONTAINER_APP_NAME: bcps-redistricting-${{ github.event.inputs.environment || (github.ref == 'refs/heads/develop' && 'dev') || (github.ref == 'refs/heads/staging' && 'staging') || 'prod' }}-api
  STATIC_WEB_APP_NAME: bcps-redistricting-${{ github.event.inputs.environment || (github.ref == 'refs/heads/develop' && 'dev') || (github.ref == 'refs/heads/staging' && 'staging') || 'prod' }}-swa

jobs:
  # Detect which paths changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
            frontend:
              - 'src/**'
              - 'package.json'
              - 'vite.config.ts'
              - 'tsconfig.json'

  ci:
    uses: ./.github/workflows/ci.yml
    with:
      environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/develop' && 'dev') || (github.ref == 'refs/heads/staging' && 'staging') || 'prod' }}
    secrets: inherit
  
  deploy-backend:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_backend != 'true') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.backend == 'true')
    needs: [ci, changes]
    runs-on: ubuntu-latest
    name: Deploy Backend API
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Build and push Docker image
        run: |
          # Login to ACR
          az acr login --name ${{ env.ACR_NAME }}
          
          # Build and tag image with git SHA
          cd backend
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/redistricting-api:${{ github.sha }} .
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/redistricting-api:latest .
          
          # Push both tags
          docker push ${{ env.ACR_NAME }}.azurecr.io/redistricting-api:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/redistricting-api:latest
          
          echo "✅ Docker image pushed: ${{ env.ACR_NAME }}.azurecr.io/redistricting-api:${{ github.sha }}"
      
      - name: Update Container App Image
        run: |
          echo "Updating Container App with new image..."
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/redistricting-api:${{ github.sha }}
          
          echo "✅ Container App updated successfully"
      
      - name: Verify API Health
        run: |
          # Get the API URL
          API_URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          
          echo "API URL: https://$API_URL"
          
          # Wait for deployment to stabilize
          sleep 30
          
          # Check health endpoint
          HEALTH_STATUS=$(curl -s "https://$API_URL/health" | jq -r '.status')
          
          if [ "$HEALTH_STATUS" = "healthy" ]; then
            echo "✅ API is healthy"
          else
            echo "❌ API health check failed"
            exit 1
          fi

  deploy-frontend:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_frontend != 'true') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.frontend == 'true')
    needs: [changes]
    runs-on: ubuntu-latest
    name: Deploy Frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get Mapbox API Key from Key Vault
        id: get-mapbox-key
        run: |
          VAULT_NAME="bcps-redistricting-prod-kv"
          
          MAPBOX_KEY=$(az keyvault secret show \
            --name mapbox-api-key \
            --vault-name "$VAULT_NAME" \
            --query value -o tsv)
          
          if [ -z "$MAPBOX_KEY" ] || [ ${#MAPBOX_KEY} -lt 50 ]; then
            echo "Warning: Using GitHub Secret fallback"
            MAPBOX_KEY="${{ secrets.MAPBOX_API_KEY }}"
          fi
          
          echo "::add-mask::$MAPBOX_KEY"
          echo "MAPBOX_KEY=$MAPBOX_KEY" >> $GITHUB_OUTPUT
      
      - name: Get API URL
        id: get-api-url
        run: |
          # Get Container App URL for frontend to connect to
          API_FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || echo "")
          
          if [ -n "$API_FQDN" ]; then
            API_URL="https://$API_FQDN"
            echo "API_URL=$API_URL" >> $GITHUB_OUTPUT
            echo "✅ Backend API URL: $API_URL"
          else
            echo "⚠️  No backend API found, deploying frontend in static mode"
            echo "API_URL=" >> $GITHUB_OUTPUT
          fi
      
      - name: Build application
        run: npm run build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ steps.get-mapbox-key.outputs.MAPBOX_KEY }}
          VITE_API_URL: ${{ steps.get-api-url.outputs.API_URL }}
      
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"
          skip_app_build: true
      
      - name: Deployment Summary
        run: |
          FRONTEND_URL=$(az staticwebapp show \
            --name ${{ env.STATIC_WEB_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query defaultHostname -o tsv)
          
          echo "## 🚀 Deployment Complete"
          echo ""
          echo "**Frontend:** https://$FRONTEND_URL"
          
          if [ -n "${{ steps.get-api-url.outputs.API_URL }}" ]; then
            echo "**Backend API:** ${{ steps.get-api-url.outputs.API_URL }}"
          else
            echo "**Backend API:** Not deployed (static mode)"
          fi
          
          echo ""
          echo "**Commit:** ${{ github.sha }}"
          echo "**Triggered by:** ${{ github.actor }}"
