name: Documentation Lint

on:
  pull_request:
    branches:
      - master
      - main
      - develop
      - staging
    paths:
      - '**.md'
      - '.github/workflows/docs-lint.yml'
  push:
    branches:
      - master
      - main
      - develop
      - staging
    paths:
      - '**.md'

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlintrc.json
          ignore_files: node_modules,angular-app,bower_components
        continue-on-error: true

  markdown-links:
    name: Markdown Link Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          file-extension: .md
          folder-recursively: true
        continue-on-error: true
