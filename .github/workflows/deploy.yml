name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 22.20.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: true
      
      - name: Get Mapbox API Key from Key Vault
        id: get-mapbox-key
        run: |
          # Try to get from Azure Key Vault first (production)
          if az keyvault secret show --name mapbox-api-key --vault-name bcps-redistricting-prod-kv --query value -o tsv 2>/dev/null; then
            VAULT_NAME="bcps-redistricting-prod-kv"
            MAPBOX_KEY=$(az keyvault secret show \
              --name mapbox-api-key \
              --vault-name $VAULT_NAME \
              --query value -o tsv)
            echo "Retrieved Mapbox key from Azure Key Vault"
            echo "::add-mask::$MAPBOX_KEY"
            echo "MAPBOX_KEY=$MAPBOX_KEY" >> $GITHUB_OUTPUT
          else
            # Fallback to GitHub Secret
            echo "Azure Key Vault unavailable, using GitHub Secret"
            MAPBOX_KEY="${{ secrets.MAPBOX_API_KEY }}"
            echo "::add-mask::$MAPBOX_KEY"
            echo "MAPBOX_KEY=$MAPBOX_KEY" >> $GITHUB_OUTPUT
          fi
        continue-on-error: false
      
      - name: Create environment file for build
        run: |
          echo "VITE_MAPBOX_ACCESS_TOKEN=${{ steps.get-mapbox-key.outputs.MAPBOX_KEY }}" > .env.production
      
      - name: Build application
        run: npm run build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ steps.get-mapbox-key.outputs.MAPBOX_KEY }}
      
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
          skip_app_build: true
