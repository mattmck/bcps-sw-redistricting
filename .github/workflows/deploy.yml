name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Mapbox API Key from Key Vault
        id: get-mapbox-key
        run: |
          # Get Key Vault name from Terraform outputs or use default
          VAULT_NAME="bcps-redistricting-prod-kv"
          MAPBOX_KEY=$(az keyvault secret show \
            --name mapbox-api-key \
            --vault-name $VAULT_NAME \
            --query value -o tsv 2>/dev/null || echo "")
          
          if [ -z "$MAPBOX_KEY" ]; then
            echo "Warning: Could not retrieve Mapbox key from Key Vault"
            MAPBOX_KEY=${{ secrets.MAPBOX_API_KEY }}
          fi
          
          echo "::add-mask::$MAPBOX_KEY"
          echo "MAPBOX_KEY=$MAPBOX_KEY" >> $GITHUB_OUTPUT

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_MAPBOX_ACCESS_TOKEN: ${{ steps.get-mapbox-key.outputs.MAPBOX_KEY }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          output_location: 'dist'
          skip_app_build: true  # We already built it
          skip_api_build: true  # No API or database connections

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
