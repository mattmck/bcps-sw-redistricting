name: Request Copilot Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  pull-requests: write

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot as reviewer
        uses: peter-evans/request-reviewers@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reviewers: copilot
