name: CI

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches-ignore:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 22.20.0
        uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create environment file for build
        run: |
          echo "VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_API_KEY }}" > .env.production
      
      - name: Run TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: false
      
      - name: Build project
        run: npm run build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_API_KEY }}
      
      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful: dist directory created"
