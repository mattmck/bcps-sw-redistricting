name: CI

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (affects CodeQL blocking)'
        required: false
        type: string
        default: 'dev'
  pull_request:
    branches:
      - master
      - main
  push:
    branches-ignore:
      - master
      - main

jobs:
  docs-lint:
    name: Documentation Lint
    uses: ./.github/workflows/docs-lint.yml
  
  codeql:
    name: CodeQL Security Scan
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
  
  check-codeql:
    name: Check CodeQL Results
    needs: codeql
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate CodeQL for Production
        if: inputs.environment == 'prod'
        run: |
          if [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "❌ CodeQL security scan failed. Production deployment blocked."
            exit 1
          fi
          echo "✅ CodeQL passed - production deployment allowed"
      
      - name: Evaluate CodeQL for Dev/Staging
        if: inputs.environment != 'prod'
        run: |
          if [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "⚠️  CodeQL security scan failed, but allowing ${{ inputs.environment }} deployment."
            echo "Please review security findings before promoting to production."
          else
            echo "✅ CodeQL passed for ${{ inputs.environment }}"
          fi
  
  build:
    name: Build and Test
    needs: check-codeql
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 22.20.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create environment file for build
        run: |
          echo "VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_API_KEY }}" > .env.production
      
      - name: Run TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: false
      
      - name: Build project
        run: npm run build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_API_KEY }}
      
      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful: dist directory created"
