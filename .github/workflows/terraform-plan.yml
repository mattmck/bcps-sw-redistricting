name: Terraform Plan

on:
  pull_request:
    branches:
      - master
      - develop
      - staging
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read

# TODO: Remove continue-on-error once Terraform configuration is fixed
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Configure Terraform Backend
        run: |
          cat > backend-config.hcl << EOF
          resource_group_name  = "${{ secrets.TERRAFORM_STATE_RG }}"
          storage_account_name = "${{ secrets.TERRAFORM_STATE_SA }}"
          skip_provider_registration = true
          container_name       = "tfstate"
          key                  = "bcps-redistricting.plan.tfstate"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=backend-config.hcl \
            -upgrade
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="db_admin_password=${{ secrets.DB_ADMIN_PASSWORD }}" \
            -var="mapbox_api_key=${{ secrets.MAPBOX_API_KEY }}" \
            -var="acr_image_tag=${{ github.sha }}" \
            -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
